---
# Non-secret settings. Secrets live in vault.yml (see vault.example.yml).
ai_root: /srv/ai

# Inkling-2-Mini on the vLLM nightly plus the sm_89 patch, verified on the AI
# Station 2026-11-27 (KB eval, D+C at reasoning low). Change them together.
# vllm_image is the local tag compose builds from vllm_base_image
# (deploy/inference/inkling-sm89); bump the tag whenever the base changes.
# Previous model: Gemma 4 on vllm/vllm-openai:v0.28.0 (see git history).
vllm_base_image: vllm/vllm-openai@sha256:d24e5fc73f0b859bd76c9d2f6f6fa4da3001afd7637f2610876420f3027ea6c7
vllm_image: local/vllm-inkling-sm89:pr69165-d24e5fc7
model_id: thinkingmachines/Inkling-2-Mini
model_revision: c9d028302cd0f035fdf8e7e91f089a4ce94d2195
served_model_name: inkling-2-mini
# Measured 2026-11-27: weights 18.24 GiB, KV (BF16 on Ada) 23.79 GiB =
# 318,720 tokens, 3.24 concurrent full-length requests at utilization 0.90.
vllm_max_model_len: 98304
kb_embed_model: gemini-embedding-2
# Requests the model runs at once (vLLM --max-num-seqs). The gateway's global
# in-flight cap is the same number, so overload is a 429 at the gateway instead
# of a queue inside vLLM. Embeddings count against it too; they take ~100ms.
inference_max_seqs: 4
# Below the global cap, so one person cannot take every slot.
gateway_max_inflight_per_user: 2
# Output cap per chat/completion request. A reasoning model stuck thinking
# stops here (~3 min at K2's 90 tok/s) instead of holding a slot; VS Code's
# 16000 maxOutputTokens still fits.
gateway_max_output_tokens: 16384
# /chat timeout (retrieval + answer). Raise for a reasoning model.
kb_chat_timeout: 30s
# Inkling thinks by default (an unset effort renders as high). On the KB eval
# low scored best (D 42/47, C 47/47, p50 3.9s, max 11s); high hit the 30s
# timeout on 2 questions. Thinking tokens count against kb_chat_max_tokens.
kb_chat_reasoning_effort: low
kb_chat_max_tokens: 4096

# Pinned source for the platform image (built on the machine).
repo_url: https://github.com/linkc0829/llm-platform.git
repo_ref: main   # set to a tag or commit SHA for a reproducible deploy
repo_dir: "{{ ai_root }}/src/llm-platform"

# Group that lets Alloy read the platform's log files. Fixed so the GID in
# the observability .env never drifts from the host.
ailogs_gid: 2500

# Skip TLS verification of the SMTP relay. Keep false here; set it per host in
# the (gitignored) inventory.yml only while the relay serves a certificate Go
# cannot verify, such as a self-signed cert with no SAN. Mail stays encrypted
# but the relay is not authenticated.
grafana_smtp_skip_verify: false

# Clients allowed to reach gateway 12599, kb 12598 and Grafana 3000.
# Plain HTTP (decided until Phase 6), so keep this as narrow as practical.
client_subnets: []            # e.g. ["192.168.17.0/24"]
# Sources allowed to SSH. Checked before UFW is enabled, so the play cannot
# lock the operator out.
ssh_subnets: []               # e.g. ["192.168.17.0/24"]
exposed_ports: [12599, 12598, 3000]

# Leave empty until IT provides an internal NTP server (public NTP is blocked).
ntp_server: ""

nvidia_driver_package: nvidia-driver-595-open
# The driver install reboots only when this is true (-e allow_reboot=true).
allow_reboot: false

# Which compose projects `--tags stack` deploys: all, or one of them
# (-e only=platform redeploys the app without touching vLLM).
only: all

# Backups: pulled back to this directory on the control node, 0600, newest N kept.
backup_local_dir: "{{ playbook_dir }}/backups"
backup_keep: 7
