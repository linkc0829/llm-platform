# vLLM on the AI Station. Values marked B1 are placeholders until the B1 load
# test settles them; everything else is the restart/health contract A6 owns.
#
#   cp .env.example .env   # fill VLLM_IMAGE, VLLM_MODEL, HF cache path
#   docker compose up -d
services:
  vllm:
    image: ${VLLM_IMAGE:?pin an exact vllm/vllm-openai tag}
    # Docker restarts the container when vLLM exits (crash, OOM kill); the
    # docker daemon itself is started by systemd, which covers host reboots.
    restart: unless-stopped
    command:
      - --model=${VLLM_MODEL:?set the served checkpoint}
      - --served-model-name=${VLLM_SERVED_MODEL_NAME:?name clients send; change it whenever the weights change}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-32768}          # B1
      - --gpu-memory-utilization=${VLLM_GPU_MEM_UTIL:-0.90}  # B1
      - --enable-prefix-caching
    # Loopback only: vLLM has no per-user auth. Everything goes through the
    # gateway, which does.
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    volumes:
      - ${HF_CACHE_DIR:?host path for model weights}:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # vLLM's /health is 200 only once the engine is up. Loading the weights
    # takes minutes, so start_period keeps Docker from marking a cold start
    # unhealthy. Docker does not restart on "unhealthy"; the status is for
    # operators and B2's recovery timing (the gateway's /readyz is the other half).
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10m
